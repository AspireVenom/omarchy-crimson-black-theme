# Crimson Black: the theme owns every Hyprland color; ~/.config/hypr/looknfeel.conf keeps geometry only.
$activeBorderColor = rgba(ef2a42ff) rgba(e0112bff) rgba(7a0916ff) 45deg
$inactiveBorderColor = rgba(1a1a1aff)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor

    groupbar {
        col.active = rgba(5c0d16ff)
        col.inactive = rgba(0a0a0aff)
        text_color = rgb(ffffff)
        text_color_inactive = rgba(7c7c7cff)
    }
}
